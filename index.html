<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <!-- erro de link <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200..900&display=swap" rel="stylesheet"> -->

    <title>Pesquisa SenaiTec</title>
</head>
<body>
    
    <main>
    <header>
        <img src="./img/logo.png" alt="Logo do senaiTec"
        width="200px" height="200px">
        <h1>Pesquisa SenaiTec</h1>
    </header>
    <section>
        <form action="index.html" method="get">

            <fieldset>

                <legend>Dados Pessoais</legend>

            <label for="userName">Nome:</label>
            <input type="text" name="userName" id="userName"required>
            <br>

            <label for="userAge">Idade:</label>
            <input type="number" name="userAge" id="userAge"
            required min="12" max="100">
            <br>
            
            <label for="userBirthDate">Data de Nascimento:</label>
            <input type="date" name="userBirthDate" id="userBirthDate">
            <br>

            <label for="userEmail">Email:</label>
            <input type="email" name="userEmail" id="userEmail">
            <br>

            <label for="userPhone">Telefone:</label>
            <input type="tel" name="userPhone" id="userPhone"
            pattern="[0-9]{11}" placeholder="21987654321">
            <br>

            <label for="userImage">Upload da foto:</label>
            <input type="file" name="userImage" id="userImage">
            <br>




            </fieldset>

            <fieldset>
                <legend>Perfil</legend>

                <p>Gênero</p>
            

                <input type="radio" name="userGender" id="userGender1" value="masculino">
                <label for="userGender1">Masculino</label>
                <br>

                <input type="radio" name="userGender" id="userGender2" value="feminino">
                <label for="userGender2">Feminino</label>
                <br>

                <input type="radio" name="userGender" id="userGender3" value="outro">
                <label for="userGender3">Prefiro não informar</label>
                <br>

                <label for="userMaritalStatus">Estado Civil</label>
                <select name="userMaritalStatus" id="userMaritalStatus">
                    <option value="solteiro">Solteiro(a)</option>
                     <option value="casado">Casado(a)</option>
                      <option value="viuvo">Viuvo(a)</option>
                       <option value="uniaoEstavel">União Estavel(a)</option>
                <br>

                </select>
                <br>
                <label for="userState">Estado(UF)</label>
                <select  name="userState" id="userState">
                    <option value="">Selecione...</option>
                    <option value="AC">Acre</option>
                    <option value="AL">Alagoas</option>
                    <option value="AP">Amapá</option>
                    <option value="AM">Amazonas<option>
                    <option value="BA">Bahia</option>
                    <option value="CE">Ceará</option>
                    <option value="ES">Espírito Santo</option>
                    <option value="GO">Goiás</option>
                    <option value="MA">Maranhão</option>
                    <option value="MT">Mato Grosso</option>
                    <option value="MS">Mato Grosso do Sul</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="PA">Pará</option>
                    <option value="PB">Paraiba</option>
                    <option value="PR">Paraná</option>
                    <option value="PE">Pernambuco</option>
                    <option value="PI">Piauí</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="RN">Rio Grande do Norte</option>
                    <option value="RS">Rio Grande do Sul</option>
                    <option value="RO">Rondônia</option>
                    <option value="RR">Roraima</option>
                    <option value="SC">Santa Catarina</option>
                    <option value="SP">São Paulo</option>
                    <option value="SE">Sergipe</option>
                    <option value="TO">Tocantins</option>

                    </select>
                    <br>
                    <label for="userCity">Cidade:</label>
                    <input type="text" name="userCity" id="userCity"
                    placeholder="Fortaleza">
                    
                    
            </fieldset>
            <fieldset>
                <legend>Hábitos</legend>
                <p>Redes Sociais</p>

                <input type="checkbox" name="userSocial"
                id="userSocial1" value="instagram">
                <img src="./img/Instagram_icon.png" width="20" alt="Icone do Instagram">
                <label for="userSocial1">Instagram</label>
                
                <br>
                <input type="checkbox" name="userSocial"
                id="userSocial2" value="facebook">
                <img src="./img/facebook-6.png" width="20" alt="Icone do Facebook">
                <label for="userSocial2">Facebook</label>
                <br>
                <input type="checkbox" name="userSocial"
                id="userSocial3" value="linkedin">
                <img src="./img/linkedin-logo-icon-free-png.webp" width="20" alt="Icone do Linkedin">
                <label for="userSocial3">Linkedin</label>
                <br>
                
                <!--estilo musical-->
                <label for="userMusicStyle">Estilo Musical</label>
                <input type="text" name="userMusicStyle" id="userMusicStyle" 
                list="userMusicStyles">
                <datalist id="userMusicStyles">
                    <option value="Rock"></option>
                    <option value="Pop"></option>
                    <option value="Sertanejo"></option>
                    <option value="funk"></option>
                    <option value="Pagode"></option>
                    <option value="Forró"></option>
                </datalist>
                 <!--cor favorita-->
                <label for="userFavoriteColor">Cor favorita:</label>
                <input type="color" name="color" id="userFavoriteColor">

            </fieldset>

         <!-- fieldset satifacao -->
            <fieldset>
                
                <legend>Satisfação</legend>
                <p>Escala de Satisfação</p>

            <input type="radio" name="escalas" id="escalas_1" value="Ruim"> 
            <label for="escalas_1">Ruim</label>
            <br>
            <input type="radio" name="escalas" id="escalas_2" value="Boa">
            <label for="escalas_2">Boa</label>
            <br>
            <input type="radio" name="escalas" id="escalas_3" value="Regular"> 
            <label for="escalas_3">Regular</label>
            <br>
            <input type="radio" name="escalas" id="escalas_4" value="Otima"> 
            <label for="escalas_4">Otima</label>

            <br>

            <label for="userDescription" name="userDescription">Descrição Adicional</label>
            <input type="text" name="descrição adicional" id="descrição adicional">
            </fieldset>
            

            <!--radio 
            label nivel de satisfação com o SenaiTec:
            name userSatisfaction
            otima,boa,regular e ruim
            -->




            <button type="submit">Enviar</button>

    
        </form>
    </section>
    </main> 




</body>
</html>
